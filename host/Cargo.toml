[package]
name = "esp-top"
version = "0.3.0"
edition = "2021"
description = "ESP32 workload manager, protocol client, package tool, simulator, and TUI"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
